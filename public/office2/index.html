<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradingLab · Escritório 2.0</title>
<link rel="icon" href="/office/icon-192.png">
<link rel="stylesheet" href="/office2/style.css">
</head>
<body>
<header class="topbar">
 <a class="logo" href="/office2/" data-truth="STATIC"><span class="logo-mark" aria-hidden="true"></span>TRADINGLAB</a>
 <nav aria-label="Zonas do escritório">
  <button type="button" data-room="">Início</button>
  <button type="button" data-room="horizon">Horizon</button>
  <button type="button" data-room="nexus">Nexus</button>
  <button type="button" data-room="ring">Ring</button>
  <button type="button" data-room="stress-lab">Stress Lab</button>
  <button type="button" data-room="risk">Risk</button>
  <button type="button" data-room="auditoria">Auditoria</button>
  <button type="button" data-room="diagnostico">Diagnóstico</button>
  <button type="button" data-room="backtest">Backtest</button>
  <button type="button" data-room="convivencia">Convivência</button>
  <button type="button" data-room="recepcao">Recepção</button>
 </nav>
 <div class="status">
  <select id="otherRooms" aria-label="Outros ambientes"><option value="">Outros ambientes</option><option value="hall-marca">Hall TradingLab</option><option value="elevadores">Elevadores</option><option value="cozinha">Cozinha</option><option value="cafe">Café</option><option value="varanda">Varanda</option><option value="terraco-norte">Jardim externo</option></select>
  <span class="chip" id="market" data-truth="UNKNOWN">mercado: …</span>
  <span class="chip" id="session" data-truth="UNKNOWN">sessão: …</span>
  <label class="lighting-control">Luz <select id="lightingMode" aria-label="Iluminação do escritório" data-truth="STATIC"><option value="auto">Automática</option><option value="day">Dia</option><option value="dusk">Entardecer</option><option value="night">Noite</option></select></label>
  <div class="clock" data-truth="REAL"><span id="clockDate"></span><b id="clockTime"></b></div>
  <a class="chip link" href="/office2/sinais.html" title="Colar sinais do canal e ver o resultado simulado">Sinais</a>
  <a class="chip link" href="/office/" title="Painéis e ferramentas do primeiro escritório">Escritório anterior</a>
 </div>
</header>
<main class="layout">
 <div class="viewport" id="viewport">
  <canvas id="scene" aria-label="Escritório TradingLab no 30º andar, visão isométrica; clique numa zona para ampliar"></canvas>
  <div class="labels" id="labels"></div>
  <div class="view-controls" aria-label="Controles da visão"><button type="button" data-zoom="0.8" aria-label="Afastar a visão">−</button><button type="button" data-zoom="1.25" aria-label="Aproximar a visão">+</button><button type="button" id="fitView">Enquadrar</button></div>
  <div class="floor-card" data-truth="STATIC"><span class="tower" aria-hidden="true"></span><div><b>30º andar</b><span>TradingLab HQ</span></div></div>
  <p class="banner" id="agentsStatus" hidden data-truth="UNKNOWN">Agentes: sem dado (sem acesso ou rota indisponível). Nenhum agente é desenhado sem dado.</p>
  <ul class="legend" aria-label="Legenda">
   <li data-truth="REAL">real</li><li data-truth="STATIC">decoração</li><li data-truth="SIMULATION">simulação</li><li data-truth="UNKNOWN">sem dado</li>
  </ul>
 </div>
 <aside class="panel" id="panel" hidden aria-live="polite"></aside>
</main>
<script src="/office/character-frames.js"></script>
<script src="/office2/iso.js"></script>
<script src="/office2/ambience.js"></script>
<script src="/office2/navigation-icons.js"></script>
<script src="/office2/scene.js"></script>
<script src="/office2/ring.js"></script>
<script src="/office2/lab.js"></script>
<script src="/office2/ops.js"></script>
<script src="/office2/horizon.js"></script>
<script src="/office2/app.js"></script>
</body>
</html>
