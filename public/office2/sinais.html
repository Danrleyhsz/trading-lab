<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinais · TradingLab</title>
<link rel="icon" href="/office/icon-192.png">
<style>
:root{--bg:#0f1220;--card:#181c2e;--line:#2a3050;--text:#e7e9f3;--muted:#9aa2c0;--accent:#6ea8ff;--ok:#43c59e;--bad:#ef6a6a;--warn:#e7b44c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:#0b0e19;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1}
a{color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px;display:grid;gap:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
textarea,input,select,button{font:inherit;color:inherit}
textarea,input,select{font-size:16px}
textarea{width:100%;min-height:150px;resize:vertical;background:#0d1020;border:1px solid var(--line);border-radius:8px;padding:10px}
input,select{background:#0d1020;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
button{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:#222844;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#0b0e19;font-weight:600}
button:disabled{opacity:.5;cursor:default}
.seal{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--warn);color:var(--warn);white-space:nowrap}
.muted{color:var(--muted);font-size:13px}
.msg{overflow-wrap:anywhere;margin-top:10px;padding:10px;border-radius:8px;background:#0d1020;border:1px solid var(--line)}
.msg.bad{border-color:var(--bad)}.msg.good{border-color:var(--ok)}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}dt{color:var(--muted)}dd{margin:0}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button[aria-pressed=true]{background:var(--accent);color:#0b0e19;border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:10px}
.stat{background:#0d1020;border:1px solid var(--line);border-radius:8px;padding:8px}.stat b{display:block;font-size:18px}.stat span{display:block}
ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
li{overflow-wrap:anywhere;background:#0d1020;border:1px solid var(--line);border-radius:8px;padding:10px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.hidden{display:none}
</style>
</head>
<body>
<header>
 <h1>Sinais do canal</h1>
 <span class="seal" title="Nenhuma ordem é enviada">SIMULAÇÃO · paper</span>
 <a href="/office2/">Escritório</a>
</header>
<main>
 <section id="login" class="hidden" aria-labelledby="loginTitle">
  <h2 id="loginTitle">Entrar</h2>
  <p class="muted">Use o mesmo código de acesso do escritório.</p>
  <form id="loginForm" class="row">
   <label class="hidden" for="accessToken">Código de acesso</label>
   <input id="accessToken" type="password" autocomplete="current-password" placeholder="Código de acesso" required>
   <button class="primary" type="submit">Entrar</button>
  </form>
  <p id="loginStatus" class="muted" role="status"></p>
 </section>

 <section aria-labelledby="pasteTitle">
  <h2 id="pasteTitle">Colar mensagem</h2>
  <label class="muted" for="message">Cole a mensagem inteira, do jeito que veio no grupo.</label>
  <textarea id="message" placeholder="🔥🔥🔥🥷 09:51 | AIOTUSDT | PREÇO ATUAL: …"></textarea>
  <div class="row">
   <label for="receivedDate">Recebida em</label>
   <input id="receivedDate" type="date">
   <button id="checkBtn" class="primary" type="button">Conferir</button>
   <button id="saveBtn" type="button" disabled>Registrar</button>
  </div>
  <div id="preview" role="status" aria-live="polite"></div>
 </section>

 <section aria-labelledby="reportTitle">
  <h2 id="reportTitle">Resultado com preços reais da Binance</h2>
  <p class="muted">Cada sinal é refeito com as velas de 1 minuto desde a hora da mensagem. Atualizar busca dados novos.</p>
  <div class="row"><button id="refreshBtn" type="button">Atualizar resultados</button><span id="reportStatus" class="muted" role="status"></span></div>
  <div id="tabs" class="tabs row" role="group" aria-label="Carteira e variante"></div>
  <div id="stats" class="stats"></div>
  <ul id="signals" aria-label="Sinais"></ul>
  <details class="row"><summary>Mensagens registradas</summary><ul id="messages"></ul></details>
 </section>
</main>
<script src="/office2/sinais.js"></script>
</body>
</html>
