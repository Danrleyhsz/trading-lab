name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tradinglab_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: tradinglab_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://tradinglab_test:ci-test-only@localhost:5432/tradinglab_test
      - run: npm run build
      - run: node --test dist/test/cloud-launch.test.js dist/test/access-control.test.js
      - run: node --test dist/test/office*.test.js
      - run: node --test dist/test/historical-study-runner.test.js dist/test/perpetual-studies.test.js dist/test/historical-study-audit.test.js
      - run: docker build -t trading-lab:ci .
      - name: Compiled production image refuses missing launch prerequisites
        run: |
          if docker run --rm -e NODE_ENV=production -e PAPER_TRADING_ONLY=true trading-lab:ci; then
            echo "Production image started without required protection"
            exit 1
          fi
          docker run --rm --entrypoint node trading-lab:ci -e "for (const path of ['./dist/src/check-cloud-config.js','./dist/src/check-cloud-service.js','./dist/src/import-state.js','./public/office/office-reference-v2.png']) require('fs').accessSync(path)"
